<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>זיכרון סינתטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wdth,wght@62.5..100,100..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--ink:#141414;--mute:#8a857b;--line:#d9d3c6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans Hebrew',system-ui,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100vh}
#panel{overflow:auto;padding:22px 22px 48px;border-inline-end:1px solid var(--line);font-size:13px}
#stage{position:relative;overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
h1{font-weight:900;font-stretch:75%;font-size:40px;margin:0;line-height:.9}
.lead{color:var(--mute);line-height:1.5;margin:8px 0 4px}
h3{font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:700;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.row{margin:9px 0}
.row .lab{display:flex;justify-content:space-between;margin-bottom:3px}
.row .val{color:var(--mute);direction:ltr;font-variant-numeric:tabular-nums}
.row input[type=range]{width:100%;accent-color:var(--ink);margin:0;direction:ltr}
.row select{width:100%}
.row input[type=color]{width:100%;height:26px;border:1px solid var(--line);background:none;padding:0 2px}
select,button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:5px 9px;cursor:pointer}
button:hover,select:hover{border-color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.info{color:var(--mute);font-size:12px;margin-top:8px;line-height:1.5}
#thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
#thumbs img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer;opacity:.75;outline:2px solid transparent}
#thumbs img.on{opacity:1;outline-color:var(--ink)}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:15px;line-height:1.7;pointer-events:none}
#stage.over{outline:2px dashed var(--ink);outline-offset:-12px}
</style>
</head>
<body>
<div id="app">
  <aside id="panel"></aside>
  <div id="stage"><canvas id="cv"></canvas><div id="drop">גררו לכאן את כל הגרסאות של אותו רגע<br>(רצוי 20, אותה הנחיה, אותו יחס)</div></div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="refFile" accept="image/*" hidden>
<script>
'use strict';

  'ember': ['#2b0a3d', '#b8336a', '#ff9e3d', '#ffe8a3'], 'intro': ['#000000', '#6b6b6b', '#d6d6d6'], 'ספיה': ['#2a1d12', '#7a5a3a', '#d9c3a0']

/* ===== מצב ===== */

  blur: 3, lo: 0.25, hi: 0.75, gamma: 1, boost: 1,
  order: 0, step: 10, angle: 15, dMin: 0.04, dMax: 1, tone: 1, invert: 0, gap: 0.4,

/* ===== ניתוח: יישור, ממוצע, שונות וסטייה מהמקור ===== */

function prep(img) {

  for (let i = 0; i < lum.length; i++) lum[i] = (0.2126 * small[i * 4] + 0.7152 * small[i * 4 + 1] + 0.0722 * small[i * 4 + 2]) / 255;

// המקור נכנס למסגרת של הגרסאות. אם אין עדיין גרסאות, הוא קובע את המסגרת

// סטייה: איפה הגרסאות רחוקות מהמקור, כלומר המודל זוכר לא נכון.
// ביטחון שגוי: עקבי בין הגרסאות ובכל זאת רחוק מהמקור, זיכרון סינתטי שהתקבע.

    }
  }
  // מיון לפי צבע מכומת, כדי לצייר כל צבע במסלול אחד
  const n = X.length, keys = new Map();
  for (let i = 0; i < n; i++) { const c = C[i], k = (c[0] >> 3) << 10 | (c[1] >> 3) << 5 | (c[2] >> 3); if (!keys.has(k)) keys.set(k, []); keys.get(k).push(i); }
  const D = { n, X: new Float32Array(n), Y: new Float32Array(n), R: new Float32Array(n), A: new Float32Array(n), P1: new Float32Array(n), P2: new Float32Array(n), groups: [], ms: 0, broken: 0 };
  const ph = mulberry32(S.seed + 5); let w = 0;
  for (const [, idx] of keys) {
    const c = C[idx[0]]; D.groups.push({ start: w, end: w + idx.length, color: rgbHex(c) });
    for (const i of idx) { D.X[w] = X[i]; D.Y[w] = Y[i]; D.R[w] = Rr[i]; D.A[w] = A[i]; D.P1[w] = ph() * TAU; D.P2[w] = ph() * TAU; if (A[i] > 0) D.broken++; w++; }
  }
  D.ms = performance.now() - t0; DOTS = D; dirty = true; info();
}

/* ===== ציור ===== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let dirty = true, dpr = 1;
function resize() { dpr = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr); dirty = true; }
new ResizeObserver(resize).observe(cv);
function frameOf(cw, ch, pad = 32) { const sc = Math.min((cw - pad * 2) / RW, (ch - pad * 2) / RH); return [sc, (cw - RW * sc) / 2, (ch - RH * sc) / 2]; }
function drawDots(c, cw, ch, scale, time, moving, pad) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = S.bg; c.fillRect(0, 0, cw * scale, ch * scale);
  if (!DOTS) return;
  const [sc, ox, oy] = frameOf(cw, ch, pad); c.setTransform(scale * sc, 0, 0, scale * sc, scale * ox, scale * oy);
  c.save(); c.beginPath(); c.rect(0, 0, RW, RH); c.clip();
  const D = DOTS, wr = moving ? S.wander : 0, ws = S.wspeed * TAU;
  for (const gr of D.groups) {
    c.fillStyle = gr.color; c.beginPath();
    for (let i = gr.start; i < gr.end; i++) {
      let x = D.X[i], y = D.Y[i]; const r = D.R[i];
      if (wr && D.A[i] > 0) { const a = D.A[i] * wr; x += a * Math.sin(time * ws + D.P1[i]); y += a * Math.cos(time * ws * 0.83 + D.P2[i]); }
      c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU);
    }
    c.fill();
  }
  c.restore();
}
function drawRaster(c, cw, ch, scale, kind) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = S.bg; c.fillRect(0, 0, cw * scale, ch * scale);
  const w = kind === 'map' ? aw : sw, h = kind === 'map' ? ah : sh, img = new ImageData(w, h);
  if (kind === 'map') { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const a = disorder((x + 0.5) / w * RW, (y + 0.5) / h * RH), i = (y * w + x) * 4, v = 255 * (1 - a); img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255; } }
  else img.data.set(srcArr());
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h; tmp.getContext('2d').putImageData(img, 0, 0);
  const [sc, ox, oy] = frameOf(cw, ch); c.imageSmoothingEnabled = kind !== 'map'; c.setTransform(scale, 0, 0, scale, 0, 0); c.drawImage(tmp, ox, oy, RW * sc, RH * sc);
}
function loop(now) {
  const moving = S.motion === 1 && S.view === 0;
  if ((IM.length || REF) && (dirty || moving)) {
    if (S.view === 0) drawDots(ctx, cv.clientWidth, cv.clientHeight, dpr, now / 1000, moving);
    else drawRaster(ctx, cv.clientWidth, cv.clientHeight, dpr, S.view === 1 ? 'map' : 'src');
    dirty = false;
  }
  requestAnimationFrame(loop);
}

/* ===== פאנל ===== */
const panel = document.getElementById('panel');
let timer = 0, aTimer = 0;
const later = () => { clearTimeout(timer); timer = setTimeout(rebuild, 60); };
const laterAnalyse = () => { clearTimeout(aTimer); aTimer = setTimeout(() => { analyse(); rebuild(); }, 80); };
function sec(t) { const h = document.createElement('h3'); h.textContent = t; panel.appendChild(h); }
function range(l, k, min, max, step, on = later) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="lab"><span>${l}</span><span class="val">${S[k]}</span></div><input type="range" min="${min}" max="${max}" step="${step}" value="${S[k]}">`;
  const inp = r.querySelector('input'), val = r.querySelector('.val'); inp.oninput = () => { S[k] = +inp.value; val.textContent = inp.value; on(); }; panel.appendChild(r);
}
function select(l, k, opts, on = later) {
  const r = document.createElement('div'); r.className = 'row'; const isStr = typeof S[k] === 'string';
  r.innerHTML = `<div class="lab"><span>${l}</span></div><select>${opts.map((o, i) => `<option value="${isStr ? o : i}"${(isStr ? o === S[k] : i === S[k]) ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
  r.querySelector('select').onchange = e => { S[k] = isStr ? e.target.value : +e.target.value; on(); }; panel.appendChild(r);
}
function color(l, k, on = later) {
  const r = document.createElement('div'); r.className = 'row'; r.innerHTML = `<div class="lab"><span>${l}</span></div><input type="color" value="${S[k]}">`;
  r.querySelector('input').oninput = e => { S[k] = e.target.value; on(); }; panel.appendChild(r);
}
function buttons(list) { const d = document.createElement('div'); d.className = 'btns'; for (const [t, f] of list) { const b = document.createElement('button'); b.textContent = t; b.onclick = f; d.appendChild(b); } panel.appendChild(d); return d; }
function info() {
  const el = document.getElementById('info'); if (!el) return;
  if (!IM.length) { el.textContent = 'לא נטענו גרסאות.'; return; }
  el.innerHTML = `${IM.length} גרסאות${demo ? ' (דמו מופשט לבדיקה בלבד)' : ''}${IM.length < 2 ? '. צריך לפחות שתיים כדי למדוד הסכמה.' : ''}<br>` +
    (REF ? `מקור: ${REF.name}<br>` : '') + (S.drive > 0 && !hasDev ? 'המדד דורש מקור וגרסאות. בינתיים מוצגת השונות.<br>' : '') +
    (DOTS ? `${DOTS.n.toLocaleString('he-IL')} נקודות, מהן ${DOTS.broken.toLocaleString('he-IL')} שבורות · ${DOTS.ms.toFixed(0)}ms` : '');
}
function buildPanel() {
  panel.innerHTML = `<a href="index.html" style="color:var(--mute);font-size:12px">20 השיטות</a><h1 style="margin-top:8px">זיכרון סינתטי</h1><div class="lead">אותו רגע, הרבה גרסאות. איפה שהן מסכימות הנקודות שומרות על סדר של מסמך. איפה שהן נפרדות, המודל ממציא, והסדר נשבר. הטון נשמר, המקום לא.</div>`;
  sec('גרסאות');
  buttons([['טעינת גרסאות', () => document.getElementById('file').click()], ['טעינת המקור', () => document.getElementById('refFile').click()], ['דמו מופשט', makeDemo]]);
  const th = document.createElement('div'); th.id = 'thumbs'; panel.appendChild(th);
  if (REF) { const im = document.createElement('img'); im.src = REF.url; im.title = 'המקור: ' + REF.name; im.style.outlineStyle = 'double'; if (S.source === -2) im.className = 'on'; im.onclick = () => { S.source = S.source === -2 ? -1 : -2; buildPanel(); rebuild(); }; th.appendChild(im); }
  IM.forEach((m, i) => { const im = document.createElement('img'); im.src = m.url; im.title = m.name; if (S.source === i) im.className = 'on'; im.onclick = () => { S.source = S.source === i ? -1 : i; buildPanel(); rebuild(); }; th.appendChild(im); });
  const inf = document.createElement('div'); inf.className = 'info'; inf.id = 'info'; panel.appendChild(inf);
  select('מקור הטון והצבע', 'source', ['ממוצע כל הגרסאות', ...IM.map((m, i) => `גרסה ${i + 1}`), ...(REF ? ['המקור ההיסטורי'] : [])], () => { });
  // הערך -1 הוא הממוצע, ולכן מתאימים את האינדקס
  panel.lastChild.querySelector('select').selectedIndex = S.source === -2 ? IM.length + 1 : S.source + 1;
  panel.lastChild.querySelector('select').onchange = e => { const k = e.target.selectedIndex; S.source = REF && k === IM.length + 1 ? -2 : k - 1; buildPanel(); rebuild(); };
  select('תצוגה', 'view', ['נקודות', 'מפת המצאה', 'תמונת הטון'], () => { dirty = true; });
  sec('מה נחשב המצאה');
  select('מדד', 'drive', ['שונות בין הגרסאות', 'סטייה מהמקור', 'שתיהן', 'ביטחון שגוי'], laterAnalyse);
  range('טשטוש לפני השוואה', 'blur', 0, 12, 1, laterAnalyse);
  range('סף תחתון', 'lo', 0, 1, 0.01); range('סף עליון', 'hi', 0, 1, 0.01);
  range('הגברה', 'boost', 0.2, 3, 0.05); range('עקומה', 'gamma', 0.2, 3, 0.05);
  sec('סדר: המסמך');
  select('רשת', 'order', ['רסטר מסובב', 'משושה', 'רשת ישרה']);
  range('צעד', 'step', 4, 30, 0.5); range('זווית', 'angle', 0, 90, 1);
  range('גודל מזערי', 'dMin', 0, 0.6, 0.01); range('גודל מרבי', 'dMax', 0.3, 1, 0.01);
  range('עקומת טון', 'tone', 0.3, 3, 0.05); select('טון', 'invert', ['כהה גדול', 'בהיר גדול']);
  range('מרווח', 'gap', 0, 3, 0.1);
  sec('שבירה: ההמצאה');
  select('שיטה', 'breakM', ['פיזור', 'אשכולות', 'מעוף לוי', 'גליץ סריקה']);
  range('עוצמה', 'strength', 0, 2, 0.01); range('מרחק נדידה', 'spread', 0, 3, 0.01);
  range('שכחה', 'drop', 0, 1, 0.01); range('גודל שבור מזערי', 'bMin', 0.05, 0.8, 0.01); range('גודל שבור מרבי', 'bMax', 0.05, 1, 0.01);
  range('הסטת סריקה', 'shift', 0, 3, 0.01); range('גובה פס', 'bandH', 1, 12, 1);
  range('seed', 'seed', 1, 999, 1);
  sec('צבע');
  select('צבע', 'color', ['מהתמונה', 'פלטה לפי טון', 'דיו אחד']);
  select('פלטה', 'palette', Object.keys(PALETTES)); color('דיו', 'ink'); color('רקע', 'bg', () => { dirty = true; });
  range('רוויה', 'sat', 0, 1.5, 0.01);
  range('סימון ההמצאה', 'mark', 0, 1, 0.01); color('צבע סימון', 'accent');
  sec('תנועה');
  select('תנועה', 'motion', ['עצורה', 'פועלת'], () => { dirty = true; });
  range('נדידת השבורים', 'wander', 0, 10, 0.1, () => { }); range('מהירות', 'wspeed', 0, 2, 0.01, () => { });
  sec('ייצוא');
  buttons([['PNG', () => exportPNG()], ['SVG', exportSVG], ['מפת המצאה', () => exportPNG('map')], ['הגדרות', exportSettings], ['טעינת הגדרות', importSettings], ['איפוס', () => { const keep = S.source; Object.assign(S, JSON.parse(JSON.stringify(DEF))); S.source = keep; buildPanel(); analyse(); rebuild(); }]]);
  info();
}

/* ===== ייצוא ===== */
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function exportPNG(kind) {
  const c = document.createElement('canvas'); c.width = RW * 2; c.height = RH * 2; const x = c.getContext('2d');
  if (kind === 'map') drawRaster(x, RW, RH, 2, 'map'); else drawDots(x, RW, RH, 2, 0, false, 0);
  c.toBlob(b => download(kind === 'map' ? 'invention-map.png' : 'synthetic-memory.png', b));
}
function exportSVG() {
  if (!DOTS) return; const D = DOTS; let body = '';
  for (const g of D.groups) { body += `<g fill="${g.color}">`; for (let i = g.start; i < g.end; i++) body += `<circle cx="${D.X[i].toFixed(2)}" cy="${D.Y[i].toFixed(2)}" r="${D.R[i].toFixed(2)}"/>`; body += '</g>\n'; }
  download('synthetic-memory.svg', new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${RW} ${RH}" width="${RW}" height="${RH}"><rect width="${RW}" height="${RH}" fill="${S.bg}"/>\n${body}</svg>`], { type: 'image/svg+xml' }));
}
function exportSettings() { download('memory-settings.json', new Blob([JSON.stringify({ type: 'memorySettings', version: 1, settings: S }, null, 2)], { type: 'application/json' })); }
function importSettings() {
  const f = document.createElement('input'); f.type = 'file'; f.accept = '.json';
  f.onchange = async () => { try { const o = JSON.parse(await f.files[0].text()); Object.assign(S, o.settings || {}); if (S.source >= IM.length || (S.source === -2 && !REF)) S.source = -1; buildPanel(); analyse(); rebuild(); } catch (e) { alert('קובץ הגדרות לא תקין'); } };
  f.click();
}

/* ===== קלט ===== */
const fileIn = document.getElementById('file'), stage = document.getElementById('stage');
async function fromFiles(files) {
  files = [...files].filter(f => f.type.startsWith('image/')).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  if (!files.length) return;
  await loadImages(files.map(f => URL.createObjectURL(f)), files.map(f => f.name), false);
}
fileIn.onchange = e => { fromFiles(e.target.files); fileIn.value = ''; };
const refIn = document.getElementById('refFile');
refIn.onchange = e => { const f = e.target.files[0]; if (f) loadReference(URL.createObjectURL(f), f.name); refIn.value = ''; };
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('over'); });
stage.addEventListener('dragleave', () => stage.classList.remove('over'));
stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('over'); fromFiles(e.dataTransfer.files); });

// דמו מופשט לבדיקת המנגנון בלבד: אלמנטים קבועים (אופק, מבנה) ואלמנטים שמשתנים בין הגרסאות (דמויות, עצים, עננים)
function makeDemo() {
  const urls = [], names = [], w = 960, h = 540;
  for (let v = 0; v <= 20; v++) {
    const R = mulberry32(v === 20 ? 4242 : 1000 + v), c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    const sky = x.createLinearGradient(0, 0, 0, h * 0.62); sky.addColorStop(0, `hsl(${35 + R() * 10},25%,${78 + R() * 6}%)`); sky.addColorStop(1, '#efe4cf');
    x.fillStyle = sky; x.fillRect(0, 0, w, h);
    for (let k = 0; k < 3; k++) { x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(R() * w, 40 + R() * 120, 60 + R() * 90, 14 + R() * 18, 0, 0, TAU); x.fill(); }
    const hz = h * (0.62 + (R() - 0.5) * 0.015);
    x.fillStyle = '#b59a72'; x.fillRect(0, hz, w, h - hz);
    x.fillStyle = '#5c4630'; const bx = w * 0.5 + (R() - 0.5) * 8; x.fillRect(bx - 150, hz - 150, 300, 150); x.beginPath(); x.arc(bx, hz - 150, 90, Math.PI, 0); x.fill();
    x.fillStyle = '#3a2c1e'; for (let k = 0; k < 5; k++) x.fillRect(bx - 120 + k * 56, hz - 110, 18, 60);
    for (let k = 0; k < 3; k++) { const tx = R() * w, ts = 40 + R() * 50; x.fillStyle = '#4b5a3a'; x.beginPath(); x.arc(tx, hz - ts * 1.3, ts * 0.6, 0, TAU); x.fill(); x.fillRect(tx - 4, hz - ts, 8, ts); }
    const people = 3 + Math.floor(R() * 6);
    for (let k = 0; k < people; k++) { const px = R() * w, py = hz + 20 + R() * (h - hz - 40), s = 0.6 + (py - hz) / (h - hz); x.fillStyle = '#231a12'; x.beginPath(); x.arc(px, py - 52 * s, 9 * s, 0, TAU); x.fill(); x.fillRect(px - 9 * s, py - 42 * s, 18 * s, 42 * s); }
    if (v === 20) { x.fillStyle = '#231a12'; x.fillRect(bx - 230, hz - 60, 40, 60); }
    urls.push(c.toDataURL('image/png')); names.push(v === 20 ? 'demo_original' : `demo_${v + 1}`);
  }
  const refUrl = urls.pop(), refName = names.pop();
  loadImages(urls, names, true).then(() => loadReference(refUrl, refName));
}

buildPanel(); requestAnimationFrame(loop);
</script>
