<script>
'use strict';
/* ===== בסיס ===== */
const TAU = Math.PI * 2, W = 1600, CAP = 200000;
let H = 944;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

  const n = (x, y) => { const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y, xi = X & 255, yi = Y & 255, u = fade(xf), v = fade(yf);
    return lerp(lerp(dot(p[p[xi] + yi], xf, yf), dot(p[p[xi + 1] + yi], xf - 1, yf), u), lerp(dot(p[p[xi] + yi + 1], xf, yf - 1), dot(p[p[xi + 1] + yi + 1], xf - 1, yf - 1), u), v); };

/* ===== צבע ===== */
const toLin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);

  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s, C = Math.hypot(A, B);

const PALETTES = { 'default': ['#0b1d51', '#3a6ea5', '#ff6b6b', PAPER], 'ספיה': ['#2a1d12', '#7a5a3a', '#d9c3a0', PAPER], 'S_002': ['#0f2a5c', '#208df3', '#d629b1', PAPER] };
const NQ = 48;

/* ===== הצילום: טון, גרדיאנט, אינטגרלים, מרחק מקצוות ===== */
let LUM, TONE, GA, GM, IT, IL, IL2, EDT, IMG, ready = false;
const S = { mode: 0, pal: 'default', scale: 1, black: 0.04, white: 0.92, gamma: 1.1 };

function blur(src, r) {

  for (let y = 0; y < H; y++) { let s = 0; for (let x = -r; x <= r; x++) s += src[y * W + clamp(x, 0, W - 1)]; for (let x = 0; x < W; x++) { tmp[y * W + x] = s / k; s += src[y * W + clamp(x + r + 1, 0, W - 1)] - src[y * W + clamp(x - r, 0, W - 1)]; } }
  for (let x = 0; x < W; x++) { let s = 0; for (let y = -r; y <= r; y++) s += tmp[clamp(y, 0, H - 1) * W + x]; for (let y = 0; y < H; y++) { out[y * W + x] = s / k; s += tmp[clamp(y + r + 1, 0, H - 1) * W + x] - tmp[clamp(y - r, 0, H - 1) * W + x]; } }

function integral(a) { const I = new Float64Array((W + 1) * (H + 1)); for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += a[y * W + x]; I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + row; } } return I; }

const boxMean = (I, x0, y0, x1, y1) => { const [s, n] = boxSum(I, x0, y0, x1, y1); return n ? s / n : 0; };
const cellTone = (x, y, h) => boxMean(IT, x - h, y - h, x + h, y + h);
const T = (x, y) => TONE[clamp(Math.round(y), 0, H - 1) * W + clamp(Math.round(x), 0, W - 1)];
// פירוט יחסי לבהירות, כדי שגם אזורים כהים יתחלקו
const detail = (x0, y0, x1, y1) => boxStd(x0, y0, x1, y1) / (boxMean(IL, x0, y0, x1, y1) + 0.12);
function boxStd(x0, y0, x1, y1) { const [s, n] = boxSum(IL, x0, y0, x1, y1); if (!n) return 0; const [s2] = boxSum(IL2, x0, y0, x1, y1), m = s / n; return Math.sqrt(Math.max(0, s2 / n - m * m)); }

function analyseImage() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingQuality = 'high'; x.drawImage(IMG, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data;

  const L1 = blur(LUM, 1), L3 = blur(LUM, 4);

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; let v = EDT[i]; if (x > 0) v = Math.min(v, EDT[i - 1] + 3); if (y > 0) { v = Math.min(v, EDT[i - W] + 3); if (x > 0) v = Math.min(v, EDT[i - W - 1] + 4); if (x < W - 1) v = Math.min(v, EDT[i - W + 1] + 4); } EDT[i] = v; }
  for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) { const i = y * W + x; let v = EDT[i]; if (x < W - 1) v = Math.min(v, EDT[i + 1] + 3); if (y < H - 1) { v = Math.min(v, EDT[i + W] + 3); if (x < W - 1) v = Math.min(v, EDT[i + W + 1] + 4); if (x > 0) v = Math.min(v, EDT[i + W - 1] + 4); } EDT[i] = v; }

/* ===== רשת מרחבית ===== */
class Grid {

/* ===== פרמטרים ===== */
const rg = (l, min, max, step, d) => ({ t: 'r', l, min, max, step, d });

/* ===== עשרים המנגנונים, מותאמים לצילום ===== */
const DEFS = [
{ id: 'poisson', he: 'פואסון', en: 'Poisson disk', kind: 'ink',
  desc: 'נקודות אקראיות בלי חפיפה. הצפיפות והגודל עולים עם הטון.',
  params: { seed: rg('seed', 1, 999, 1, 1), rMin: rg('רדיוס מזערי', 0.3, 3, 0.05, 0.6), rMax: rg('רדיוס מרבי', 1, 6, 0.05, 3), gap: rg('מרווח', 0, 2, 0.05, 0.35), contrast: rg('ניגודיות', 0.5, 3, 0.05, 1.4) },
  gen(p, R, k) { const out = [], G = new Grid(8), lo = p.rMin * k, hi = p.rMax * k, gap = p.gap * k, A = Math.round(W * H / (lo * hi * 1.6));
    for (let a = 0; a < A && out.length < CAP; a++) { const x = R() * W, y = R() * H, t = T(x, y); if (R() > Math.pow(t, p.contrast)) continue; const r = lerp(lo, hi, t); if (G.fits(x, y, r, gap)) { G.add(x, y, r); out.push([x, y, r, t]); } }

{ id: 'grid', he: 'רשת', en: 'Grid', kind: 'ink',
  desc: 'רסטר ישר. שטח כל נקודה שווה לטון של התא שלה.',
  params: { step: rg('צעד', 3, 20, 0.5, 7) },
  gen(p, R, k) { const out = [], s = p.step * k; for (let y = s / 2; y < H + s; y += s) for (let x = s / 2; x < W + s; x += s) { const t = cellTone(x, y, s / 2); if (t > 0.004) out.push([x, y, areaR(t, s * s), t]); } return out; } },
{ id: 'hex', he: 'משושה', en: 'Hex lattice', kind: 'ink',
  desc: 'רסטר משושי, הצפוף ביותר במישור.',
  params: { step: rg('צעד', 3, 20, 0.5, 7) },
  gen(p, R, k) { const out = [], s = p.step * k, h = s * Math.sqrt(3) / 2, cell = s * h; for (let j = 0; j * h < H + h; j++) for (let i = -1; i * s < W + s; i++) { const x = i * s + (j & 1 ? s / 2 : 0), y = j * h, t = cellTone(x, y, s / 2); if (t > 0.004) out.push([x, y, areaR(t, cell), t]); } return out; } },

/* ===== מצב ובנייה ===== */
const V = DEFS.map((def, i) => ({ def, i, params: defaults(def), D: null, ms: 0, cache: null }));
function defaults(def) { const o = {}; for (const k in def.params) o[k] = def.params[k].d; return o; }
let colors = { fg: INK, bg: PAPER, ramp: [] };
function setColors() {
  if (S.mode === 0) colors = { fg: INK, bg: PAPER, ramp: ramp([PAPER, INK], NQ) };
  else if (S.mode === 1) colors = { fg: PAPER, bg: INK, ramp: ramp([INK, PAPER], NQ) };
  else { const st = PALETTES[S.pal] || PALETTES['default']; colors = { fg: st[0], bg: PAPER, ramp: ramp(st.slice().reverse(), NQ) }; }
}
// ramp[0] הוא הרקע, ramp[NQ-1] הוא הדיו המלא
function generate(v) {
  const t0 = performance.now(), p = v.params, R = mulberry32(((p.seed || 1) * 2654435761) >>> 0 || 1), N = makeNoise(p.seed || 1);
  const raw = v.def.gen(p, R, S.scale, N).slice(0, CAP), n = raw.length;
  const fill = v.def.kind === 'fill' || S.mode === 2, groups = new Map();
  for (let i = 0; i < n; i++) { const q = fill ? clamp(Math.round(raw[i][3] * (NQ - 1)), 0, NQ - 1) : -1; if (!groups.has(q)) groups.set(q, []); groups.get(q).push(i); }
  const D = { n, X: new Float32Array(n), Y: new Float32Array(n), R: new Float32Array(n), groups: [] }; let w = 0;
  for (const [q, idx] of groups) { if (q === 0) continue; D.groups.push({ start: w, end: w + idx.length, color: q < 0 ? colors.fg : colors.ramp[q] }); for (const i of idx) { D.X[w] = raw[i][0]; D.Y[w] = raw[i][1]; D.R[w] = raw[i][2]; w++; } }
  D.n = w; v.D = D; v.ms = performance.now() - t0; v.cache = null;
}

/* ===== ציור, לפני ואחרי ===== */
function drawDots(c, v, scale, ox, oy, pw, ph) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = colors.bg; c.fillRect(0, 0, pw, ph);
  const D = v.D; if (!D) return;
  c.setTransform(scale, 0, 0, scale, ox, oy);
  for (const g of D.groups) { c.fillStyle = g.color; c.beginPath(); for (let i = g.start; i < g.end; i++) { const x = D.X[i], y = D.Y[i], r = D.R[i]; c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); } c.fill(); }
  c.setTransform(1, 0, 0, 1, 0, 0);
}
// המקור נחשף מצד ימין של הקו, האחרי משמאל לו
function compose(ctx, dotsCanvas, split, scale, ox, oy, pw, ph, dpr) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dotsCanvas, 0, 0);
  const sx = split * pw;
  if (split < 1) { ctx.save(); ctx.beginPath(); ctx.rect(sx, 0, pw - sx, ph); ctx.clip(); ctx.fillStyle = PAPER; ctx.fillRect(sx, 0, pw - sx, ph); ctx.drawImage(IMG, ox, oy, W * scale, H * scale); ctx.restore(); }
  if (split > 0 && split < 1) {
    ctx.fillStyle = '#e8442c'; ctx.fillRect(sx - dpr / 2, 0, dpr, ph);
    ctx.font = `${11 * dpr}px "Noto Sans Hebrew", sans-serif`; ctx.textBaseline = 'top';
    const lab = (t, x, al) => { ctx.textAlign = al; const w = ctx.measureText(t).width + 10 * dpr; ctx.fillStyle = 'rgba(20,20,20,.75)'; ctx.fillRect(al === 'left' ? x : x - w, 8 * dpr, w, 18 * dpr); ctx.fillStyle = '#fff'; ctx.fillText(t, al === 'left' ? x + 5 * dpr : x - 5 * dpr, 11 * dpr); };
    lab('אחרי', sx - 8 * dpr, 'right'); lab('לפני', sx + 8 * dpr, 'left');
  }
}

/* ===== גלריה ===== */
const grid = document.getElementById('grid'), pad = n => String(n).padStart(2, '0');
const dprOf = () => Math.min(2, devicePixelRatio || 1);
function tileRender(v) {
  if (!v.D) return; const cv = v.cv, dpr = dprOf(), pw = Math.round(cv.clientWidth * dpr), ph = Math.round(cv.clientHeight * dpr);
  if (!pw || !ph) return;
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; v.cache = null; }
  const scale = pw / W;
  if (!v.cache || v.cache.width !== pw) { const o = document.createElement('canvas'); o.width = pw; o.height = ph; drawDots(o.getContext('2d'), v, scale, 0, 0, pw, ph); v.cache = o; }
  compose(v.ctx, v.cache, v.split ?? 1, scale, 0, 0, pw, ph, dpr);
  cv.classList.remove('pending');
}
function buildGallery() {
  grid.innerHTML = '';
  V.forEach(v => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<canvas class="pending" style="aspect-ratio:${W}/${H}"></canvas><div class="cap"><span class="num">${pad(v.i + 1)}</span><span class="name">${v.def.he}</span><span class="en">${v.def.en}</span></div><div class="desc">${v.def.desc}</div>`;
    grid.appendChild(card); v.cv = card.querySelector('canvas'); v.ctx = v.cv.getContext('2d');
    v.cv.addEventListener('pointermove', e => { const r = v.cv.getBoundingClientRect(); v.split = clamp((e.clientX - r.left) / r.width, 0, 1); tileRender(v); });
    v.cv.addEventListener('pointerleave', () => { v.split = 1; tileRender(v); });
    card.onclick = () => openView(v.i);
  });
}
new ResizeObserver(() => V.forEach(v => { v.cache = null; tileRender(v); })).observe(grid);

let genToken = 0;
function generateAll() {
  const tok = ++genToken; let i = 0; const st = document.getElementById('status');
  V.forEach(v => v.cv && v.cv.classList.add('pending'));
  (function next() { if (tok !== genToken) return; if (i >= V.length) { st.textContent = ''; return; } st.textContent = `צורב ${i + 1} מתוך ${V.length}…`; const v = V[i++]; generate(v); tileRender(v); setTimeout(next, 0); })();
}

/* ===== תצוגה מלאה ===== */
const view = document.getElementById('view'), panel = document.getElementById('panel'), full = document.getElementById('full'), fctx = full.getContext('2d'), stage = document.getElementById('stage'), hint = document.getElementById('hint');
let cur = -1, F = { split: 0.5, zoom: 0, panX: 0, panY: 0, cache: null, key: '' }, timer = 0;
function openView(i) { cur = (i + V.length) % V.length; F.cache = null; view.classList.add('open'); document.body.style.overflow = 'hidden'; buildPanel(); requestAnimationFrame(renderFull); }
function closeView() { view.classList.remove('open'); document.body.style.overflow = ''; if (cur >= 0) tileRender(V[cur]); cur = -1; }
function fullGeom() {
  const dpr = dprOf(), pw = Math.round(stage.clientWidth * dpr), ph = Math.round(stage.clientHeight * dpr), fit = Math.min(pw / W, ph / H) * 0.96;
  const scale = F.zoom === 0 ? fit : F.zoom * dpr, ox = (pw - W * scale) / 2 + F.panX * dpr, oy = (ph - H * scale) / 2 + F.panY * dpr;
  return { dpr, pw, ph, scale, ox, oy };
}
function renderFull() {
  if (cur < 0) return; const v = V[cur], g = fullGeom();
  if (full.width !== g.pw || full.height !== g.ph) { full.width = g.pw; full.height = g.ph; }
  const key = [g.pw, g.ph, g.scale, g.ox, g.oy].join(',');
  if (!F.cache || F.key !== key || F.v !== v.D) { const o = F.cache && F.cache.width === g.pw && F.cache.height === g.ph ? F.cache : document.createElement('canvas'); o.width = g.pw; o.height = g.ph; drawDots(o.getContext('2d'), v, g.scale, g.ox, g.oy, g.pw, g.ph); F.cache = o; F.key = key; F.v = v.D; }
  compose(fctx, F.cache, F.split, g.scale, g.ox, g.oy, g.pw, g.ph, g.dpr);
  hint.textContent = F.zoom ? 'גרירה: הזזה · Shift ותנועה: קו ההשוואה · Esc: חזרה' : 'תנועת העכבר מזיזה את קו ההשוואה · חצים: מנגנון הבא · Esc: חזרה';
}
new ResizeObserver(() => { F.cache = null; renderFull(); }).observe(stage);
let drag = null;
stage.addEventListener('pointerdown', e => { if (F.zoom) { drag = { x: e.clientX, y: e.clientY, px: F.panX, py: F.panY }; stage.setPointerCapture(e.pointerId); } });
stage.addEventListener('pointerup', () => drag = null);
stage.addEventListener('pointermove', e => {
  if (drag) { F.panX = drag.px + e.clientX - drag.x; F.panY = drag.py + e.clientY - drag.y; requestAnimationFrame(renderFull); return; }
  if (F.mode === 'cmp' && (!F.zoom || e.shiftKey)) { const r = stage.getBoundingClientRect(); F.split = clamp((e.clientX - r.left) / r.width, 0, 1); renderFull(); }
});
addEventListener('keydown', e => {
  if (cur < 0) return; if (/INPUT|SELECT/.test(document.activeElement.tagName) && e.key !== 'Escape') return;
  if (e.key === 'Escape') closeView(); else if (e.key === 'ArrowLeft') openView(cur + 1); else if (e.key === 'ArrowRight') openView(cur - 1);
});

function rowRange(l, P, val, on) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="lab"><span>${l}</span><span class="val">${val}</span></div><input type="range" min="${P.min}" max="${P.max}" step="${P.step}" value="${val}">`;
  const inp = r.querySelector('input'), sp = r.querySelector('.val'); inp.oninput = () => { sp.textContent = inp.value; on(+inp.value); }; panel.appendChild(r);
}
function rowSelect(l, opts, val, on) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="lab"><span>${l}</span></div><select>${opts.map((o, k) => `<option value="${k}"${k === val ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
  r.querySelector('select').onchange = e => on(+e.target.value); panel.appendChild(r);
}
const sec = t => { const h = document.createElement('h3'); h.textContent = t; panel.appendChild(h); };
function regen() { clearTimeout(timer); timer = setTimeout(() => { const v = V[cur]; generate(v); F.cache = null; renderFull(); info(); }, 80); }
function info() { const el = document.getElementById('pInfo'), v = V[cur]; if (el && v && v.D) el.textContent = `${v.D.n.toLocaleString('he-IL')} נקודות · ${v.ms.toFixed(0)}ms`; }
function buildPanel() {
  const v = V[cur], d = v.def; F.mode = F.mode || 'cmp';
  panel.innerHTML = `<div class="nav"><button id="pPrev">הקודם</button><button id="pBack">לגלריה</button><button id="pNext">הבא</button></div>
  <div class="ph"><span class="num">${pad(cur + 1)}</span><span class="name">${d.he}</span></div><div class="en">${d.en}</div><div class="pdesc">${d.desc}</div><div class="info" id="pInfo"></div>`;
  panel.querySelector('#pPrev').onclick = () => openView(cur - 1); panel.querySelector('#pNext').onclick = () => openView(cur + 1); panel.querySelector('#pBack').onclick = closeView;
  sec('תצוגה');
  const b1 = document.createElement('div'); b1.className = 'btns';
  for (const [t, m, s] of [['לפני', 'before', 1e-9], ['השוואה', 'cmp', 0.5], ['אחרי', 'after', 1]]) { const b = document.createElement('button'); b.textContent = t; if (F.mode === m) b.className = 'on'; b.onclick = () => { F.mode = m; F.split = m === 'before' ? 0 : s; buildPanel(); renderFull(); }; b1.appendChild(b); }
  panel.appendChild(b1);
  const b2 = document.createElement('div'); b2.className = 'btns'; b2.style.marginTop = '6px';
  for (const [t, z] of [['התאמה', 0], ['1:1', 1], ['2:1', 2], ['4:1', 4]]) { const b = document.createElement('button'); b.textContent = t; if (F.zoom === z) b.className = 'on'; b.onclick = () => { F.zoom = z; F.panX = F.panY = 0; stage.classList.toggle('pan', !!z); buildPanel(); F.cache = null; renderFull(); }; b2.appendChild(b); }
  panel.appendChild(b2);
  sec('פרמטרים');
  for (const k in d.params) { const P = d.params[k]; if (P.t === 'r') rowRange(P.l, P, v.params[k], x => { v.params[k] = x; regen(); }); else rowSelect(P.l, P.o, v.params[k], x => { v.params[k] = x; regen(); }); }
  sec('טון (לכל המנגנונים)');
  const retone = () => { clearTimeout(timer); timer = setTimeout(() => { computeTone(); V.forEach(x => x.D = null); generate(V[cur]); F.cache = null; renderFull(); info(); generateAll(); }, 150); };
  rowRange('נקודה שחורה', { min: 0, max: 0.5, step: 0.01 }, S.black, x => { S.black = x; retone(); });
  rowRange('נקודה לבנה', { min: 0.5, max: 1, step: 0.01 }, S.white, x => { S.white = x; retone(); });
  rowRange('עקומה', { min: 0.4, max: 2.5, step: 0.05 }, S.gamma, x => { S.gamma = x; retone(); });
  sec('ייצוא');
  const ex = document.createElement('div'); ex.className = 'btns'; ex.innerHTML = '<button data-x="png">PNG</button><button data-x="svg">SVG</button><button data-x="reset">איפוס פרמטרים</button>';
  ex.onclick = e => { const x = e.target.dataset.x; if (x === 'reset') { v.params = defaults(d); generate(v); F.cache = null; buildPanel(); renderFull(); } else if (x) exportVariant(v, x); };
  panel.appendChild(ex); info();
}

/* ===== ייצוא ===== */
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function exportVariant(v, type) {
  const name = `declaration_${pad(v.i + 1)}_${v.def.id}`;
  if (type === 'png') { const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2; drawDots(c.getContext('2d'), v, 2, 0, 0, c.width, c.height); c.toBlob(b => download(name + '.png', b)); return; }
  const D = v.D; let body = '';
  for (const g of D.groups) { body += `<g fill="${g.color}">`; for (let i = g.start; i < g.end; i++) body += `<circle cx="${D.X[i].toFixed(2)}" cy="${D.Y[i].toFixed(2)}" r="${D.R[i].toFixed(2)}"/>`; body += '</g>\n'; }
  download(name + '.svg', new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${colors.bg}"/>\n${body}</svg>`], { type: 'image/svg+xml' }));
}

/* ===== שליטה כללית ===== */
const gMode = document.getElementById('gMode'), gPal = document.getElementById('gPal'), gScale = document.getElementById('gScale');
gPal.innerHTML = Object.keys(PALETTES).map(k => `<option>${k}</option>`).join('');
const restyle = (retone) => { if (retone) computeTone(); setColors(); generateAll(); };
gMode.onchange = () => { const was = S.mode; S.mode = +gMode.value; restyle((was === 1) !== (S.mode === 1)); };
gPal.onchange = () => { S.pal = gPal.value; if (S.mode === 2) restyle(false); };
gScale.onchange = () => { S.scale = +gScale.value; restyle(false); };

/* ===== טעינה ===== */
IMG = new Image();
IMG.onload = () => {
  H = Math.round(W * IMG.naturalHeight / IMG.naturalWidth);
  try { analyseImage(); } catch (e) { document.getElementById('status').textContent = 'הדפדפן חסם קריאה של הצילום. צריך לפתוח את הדף דרך GitHub Pages או שרת מקומי, ולא ישירות מהקובץ.'; return; }
  setColors(); buildGallery(); generateAll();
};
IMG.onerror = () => { document.getElementById('status').textContent = 'הקובץ declaration.jpg לא נמצא ליד הדף.'; };
IMG.src = 'declaration.jpg';
</script>
</body>
</html>
